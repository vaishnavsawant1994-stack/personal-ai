name: PWA mobile visual preview

on:
  pull_request:
    paths:
      - 'pwa/**'
      - 'tests/pwa_mobile_preview.mjs'
      - '.github/workflows/pwa-mobile-preview.yml'

permissions:
  contents: read

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the PWA and capture iPhone viewports
        run: |
          python3 -m http.server 4173 --bind 0.0.0.0 --directory . >/tmp/pwa-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/iphone/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/pwa_mobile_preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-mobile-preview
          path: artifacts/personal-ai-iphone-390x844.png
          if-no-files-found: error
          retention-days: 7
