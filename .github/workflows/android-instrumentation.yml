name: Android Instrumentation
on:
  pull_request:
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          working-directory: android-companion
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: gradle connectedDebugAndroidTest --stacktrace --info
      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          mkdir -p android-diagnostics
          adb devices -l > android-diagnostics/adb-devices.txt || true
          adb logcat -d > android-diagnostics/logcat.txt || true
          cp -R android-companion/app/build/reports/androidTests android-diagnostics/reports 2>/dev/null || true
      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-instrumentation-diagnostics
          path: android-diagnostics
          if-no-files-found: ignore
