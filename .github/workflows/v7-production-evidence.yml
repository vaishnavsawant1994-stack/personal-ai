name: V7 Production Evidence
on:
  workflow_dispatch:
    inputs:
      audio_seconds:
        description: "Realtime microphone/speaker probe duration"
        required: true
        default: "45"
      soak_hours:
        description: "Long soak duration"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "4", "6"]

jobs:
  realtime-audio:
    runs-on: [self-hosted, personal-ai-audio]
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REALTIME_PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify physical microphone and speaker + OpenAI Realtime round trip
        run: python tests/realtime_hardware_probe.py --seconds "${{ inputs.audio_seconds }}"

  android-physical:
    runs-on: [self-hosted, android, personal-ai-device]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Reject emulator and require exactly one healthy physical device
        shell: bash
        run: |
          mapfile -t DEVICES < <(adb devices | awk 'NR>1 && $2=="device" {print $1}')
          test "${#DEVICES[@]}" -eq 1
          SERIAL="${DEVICES[0]}"
          case "$SERIAL" in emulator-*|127.0.0.1:*) echo "Emulator is not physical evidence"; exit 1;; esac
          test "$(adb -s "$SERIAL" shell getprop ro.kernel.qemu | tr -d '\r')" != "1"
          echo "SERIAL=$SERIAL" >> "$GITHUB_ENV"
      - name: Build, install and instrument physical companion
        working-directory: android-companion
        run: |
          gradle assembleDebug assembleDebugAndroidTest --stacktrace
          adb -s "$SERIAL" install -r app/build/outputs/apk/debug/app-debug.apk
          gradle connectedDebugAndroidTest --stacktrace
      - name: Verify application lifecycle
        run: |
          adb -s "$SERIAL" shell monkey -p ai.personal.companion 1
          sleep 5
          adb -s "$SERIAL" shell pidof ai.personal.companion

  multi-hour-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt psutil
      - name: Run V7 multi-hour integration soak
        shell: bash
        run: python tests/soak_runtime.py --seconds "$(( ${{ inputs.soak_hours }} * 3600 ))"
