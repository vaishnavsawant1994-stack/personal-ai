name: CI


on:
  push:
  pull_request:
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q app agent automation browser capabilities core dashboard desktop devices integrations memory models proactive qualification security server tools ui updates vision voice
      - run: pytest -q

